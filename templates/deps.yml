name: deps

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: guinea-rs/.github/.github/workflows/deps-audit.yml@SHA
    with:
      manifests: '["Cargo.toml"]'

  tags:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: guinea-rs/.github/.github/workflows/deps-tags.yml@SHA
    with:
      manifests: '["Cargo.toml"]'
